name: Deploy to Hostinger VPS

on:
  push:
    branches: [main]

env:
  DOCKER_BUILDKIT: 1
  COMPOSE_DOCKER_CLI_BUILD: 1
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  deploy:
    name: Deploy to Production
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Preflight SSH connectivity
        id: ssh_preflight
        shell: bash
        run: |
          set -e
          HOST="${{ secrets.VPS_HOST }}"
          PREFERRED_PORT="${{ secrets.VPS_PORT }}"

          if [ -z "$HOST" ]; then
            echo "Missing required GitHub secret: VPS_HOST"
            exit 1
          fi

          if [ -z "$PREFERRED_PORT" ]; then
            PREFERRED_PORT="22"
          fi

          can_connect() {
            local host="$1"
            local port="$2"
            timeout 10 bash -c "</dev/tcp/${host}/${port}" >/dev/null 2>&1
          }

          echo "Checking DNS resolution for SSH host..."
          if ! getent hosts "$HOST"; then
            echo "Unable to resolve VPS_HOST. Use a public IP or resolvable hostname."
            exit 1
          fi

          # Prefer IPv4 for GitHub-hosted runners where IPv6 routing may be unavailable.
          TARGET_HOST="$HOST"
          IPV4_HOST=$(getent ahostsv4 "$HOST" | awk 'NR==1 {print $1}')
          if [ -n "$IPV4_HOST" ]; then
            TARGET_HOST="$IPV4_HOST"
            echo "Using IPv4 address for SSH: ${TARGET_HOST}"
          else
            echo "No IPv4 address found for host; trying hostname directly."
          fi

          SELECTED_PORT=""
          echo "Checking TCP connectivity to ${TARGET_HOST}:${PREFERRED_PORT}..."
          if can_connect "$TARGET_HOST" "$PREFERRED_PORT"; then
            SELECTED_PORT="$PREFERRED_PORT"
          elif [ "$PREFERRED_PORT" != "22" ]; then
            echo "Configured port ${PREFERRED_PORT} is unreachable. Trying fallback port 22..."
            if can_connect "$TARGET_HOST" "22"; then
              SELECTED_PORT="22"
              echo "Using fallback SSH port 22 for this run."
            fi
          fi

          if [ -z "$SELECTED_PORT" ]; then
            echo "Cannot reach SSH endpoint from GitHub runner (timeout/refused)."
            echo "Checked ports: ${PREFERRED_PORT} and 22"
            echo "Verify VPS_HOST/VPS_PORT, cloud firewall, and UFW/iptables rules."
            exit 1
          fi

          echo "SSH endpoint is reachable at ${TARGET_HOST}:${SELECTED_PORT}."
          echo "host=${TARGET_HOST}" >> "$GITHUB_OUTPUT"
          echo "port=${SELECTED_PORT}" >> "$GITHUB_OUTPUT"

      - name: Deploy to VPS via SSH
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ steps.ssh_preflight.outputs.host }}
          username: ${{ secrets.VPS_USERNAME }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ steps.ssh_preflight.outputs.port }}
          timeout: 60s
          script_stop: true
          script: |
            set -e

            APP_DIR="/opt/app"
            REPO_URL="https://github.com/${{ github.repository }}.git"
            BRANCH="main"

            # Fail fast with clear messaging if required secrets are missing.
            DATABASE_URL_VALUE="${{ secrets.DATABASE_URL }}"
            JWT_SECRET_VALUE="${{ secrets.JWT_SECRET }}"
            TWILIO_ACCOUNT_SID_VALUE="${{ secrets.TWILIO_ACCOUNT_SID }}"
            TWILIO_AUTH_TOKEN_VALUE="${{ secrets.TWILIO_AUTH_TOKEN }}"
            CASHFREE_CLIENT_ID_VALUE="${{ secrets.CASHFREE_CLIENT_ID }}"
            CASHFREE_CLIENT_SECRET_VALUE="${{ secrets.CASHFREE_CLIENT_SECRET }}"
            CASHFREE_ENV_VALUE="${{ secrets.CASHFREE_ENV }}"

            if [ -z "$DATABASE_URL_VALUE" ]; then echo "Missing required GitHub secret: DATABASE_URL"; exit 1; fi
            if [ -z "$JWT_SECRET_VALUE" ]; then echo "Missing required GitHub secret: JWT_SECRET"; exit 1; fi
            if [ -z "$TWILIO_ACCOUNT_SID_VALUE" ]; then echo "Missing required GitHub secret: TWILIO_ACCOUNT_SID"; exit 1; fi
            if [ -z "$TWILIO_AUTH_TOKEN_VALUE" ]; then echo "Missing required GitHub secret: TWILIO_AUTH_TOKEN"; exit 1; fi
            if [ -z "$CASHFREE_CLIENT_ID_VALUE" ]; then echo "Missing required GitHub secret: CASHFREE_CLIENT_ID"; exit 1; fi
            if [ -z "$CASHFREE_CLIENT_SECRET_VALUE" ]; then echo "Missing required GitHub secret: CASHFREE_CLIENT_SECRET"; exit 1; fi
            if [ -z "$CASHFREE_ENV_VALUE" ]; then echo "Missing required GitHub secret: CASHFREE_ENV"; exit 1; fi

            TWILIO_PHONE_VALUE="${{ secrets.TWILIO_PHONE_NUMBER }}"
            TWILIO_WHATSAPP_VALUE="${{ secrets.TWILIO_WHATSAPP_NUMBER }}"
            if [ -z "$TWILIO_PHONE_VALUE" ] && [ -z "$TWILIO_WHATSAPP_VALUE" ]; then
              echo "Missing Twilio phone secret. Set TWILIO_PHONE_NUMBER or TWILIO_WHATSAPP_NUMBER."
              exit 1
            fi
            if [ -z "$TWILIO_PHONE_VALUE" ]; then
              TWILIO_PHONE_VALUE="$TWILIO_WHATSAPP_VALUE"
            fi

            sanitize_single_line() {
              printf '%s' "$1" | tr -d '\r\n'
            }

            DATABASE_URL_VALUE="$(sanitize_single_line "$DATABASE_URL_VALUE")"
            JWT_SECRET_VALUE="$(sanitize_single_line "$JWT_SECRET_VALUE")"
            TWILIO_ACCOUNT_SID_VALUE="$(sanitize_single_line "$TWILIO_ACCOUNT_SID_VALUE")"
            TWILIO_AUTH_TOKEN_VALUE="$(sanitize_single_line "$TWILIO_AUTH_TOKEN_VALUE")"
            TWILIO_PHONE_VALUE="$(sanitize_single_line "$TWILIO_PHONE_VALUE")"
            TWILIO_WHATSAPP_VALUE="$(sanitize_single_line "$TWILIO_WHATSAPP_VALUE")"
            CASHFREE_CLIENT_ID_VALUE="$(sanitize_single_line "$CASHFREE_CLIENT_ID_VALUE")"
            CASHFREE_CLIENT_SECRET_VALUE="$(sanitize_single_line "$CASHFREE_CLIENT_SECRET_VALUE")"
            CASHFREE_ENV_VALUE="$(sanitize_single_line "$CASHFREE_ENV_VALUE")"
            DIGIO_CLIENT_ID_VALUE="$(sanitize_single_line "${{ secrets.DIGIO_CLIENT_ID }}")"
            DIGIO_CLIENT_SECRET_VALUE="$(sanitize_single_line "${{ secrets.DIGIO_CLIENT_SECRET }}")"
            DIGIO_ENV_VALUE="$(sanitize_single_line "${{ secrets.DIGIO_ENV }}")"

            echo "==> Pulling latest code..."
            cd $APP_DIR

            # If repo doesn't exist, clone it
            if [ ! -d ".git" ]; then
              cd /opt
              git clone $REPO_URL app
              cd $APP_DIR
            fi

            git fetch origin $BRANCH
            git reset --hard origin/$BRANCH
            git clean -fd

            echo "==> Creating backend .env from GitHub secrets..."
            {
              echo "PORT=3000"
              echo "NODE_ENV=production"
              printf 'DATABASE_URL=%s\n' "$DATABASE_URL_VALUE"
              printf 'JWT_SECRET=%s\n' "$JWT_SECRET_VALUE"
              echo "JWT_EXPIRES_IN=7d"
              printf 'TWILIO_ACCOUNT_SID=%s\n' "$TWILIO_ACCOUNT_SID_VALUE"
              printf 'TWILIO_AUTH_TOKEN=%s\n' "$TWILIO_AUTH_TOKEN_VALUE"
              printf 'TWILIO_PHONE_NUMBER=%s\n' "$TWILIO_PHONE_VALUE"
              printf 'TWILIO_WHATSAPP_NUMBER=%s\n' "$TWILIO_WHATSAPP_VALUE"
              printf 'CASHFREE_CLIENT_ID=%s\n' "$CASHFREE_CLIENT_ID_VALUE"
              printf 'CASHFREE_CLIENT_SECRET=%s\n' "$CASHFREE_CLIENT_SECRET_VALUE"
              printf 'CASHFREE_ENV=%s\n' "$CASHFREE_ENV_VALUE"
              printf 'DIGIO_CLIENT_ID=%s\n' "$DIGIO_CLIENT_ID_VALUE"
              printf 'DIGIO_CLIENT_SECRET=%s\n' "$DIGIO_CLIENT_SECRET_VALUE"
              printf 'DIGIO_ENV=%s\n' "$DIGIO_ENV_VALUE"
            } > backend/.env

            echo "==> Secret length diagnostics (value length only):"
            awk -F= 'NF>1 { val=substr($0, index($0, "=")+1); printf "   - %s: %d\n", $1, length(val) }' backend/.env | sort -t: -k2nr

            MAX_ALLOWED_VALUE_LEN=8192
            oversize_count=$(awk -F= -v max="$MAX_ALLOWED_VALUE_LEN" 'NF>1 { val=substr($0, index($0, "=")+1); if (length(val) > max) c++ } END { print c+0 }' backend/.env)
            if [ "$oversize_count" -gt 0 ]; then
              echo "One or more secret values are unexpectedly large (> ${MAX_ALLOWED_VALUE_LEN} chars)."
              echo "Please fix malformed GitHub secrets before deployment."
              exit 1
            fi

            echo "==> Building and deploying containers..."
            export NEXT_PUBLIC_API_URL=${{ secrets.NEXT_PUBLIC_API_URL }}

            DOMAIN="ashwinisdresearch.com"
            CERT_PATH="./certbot/conf/live/${DOMAIN}/fullchain.pem"
            EMAIL="admin@${DOMAIN}"

            docker compose down --remove-orphans
            docker rm -f app-certbot app-backend app-frontend app-nginx 2>/dev/null || true
            docker network rm app_app-network 2>/dev/null || true

            docker compose build --no-cache

            # -------------------------------------------------------
            # SSL Bootstrap: if certs don't exist, get them now
            # -------------------------------------------------------
            mkdir -p certbot/www certbot/conf

            if [ ! -f "$CERT_PATH" ]; then
              echo "==> No SSL certs found. Bootstrapping with HTTP-only nginx for ACME challenge..."

              # Write a temporary HTTP-only nginx config
              mkdir -p nginx-tmp
              cat > nginx-tmp/default.conf << 'NGINXEOF'
server {
    listen 80;
    server_name ashwinisdresearch.com www.ashwinisdresearch.com api.ashwinisdresearch.com;
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }
    location / {
        return 200 'Configuring SSL...';
        add_header Content-Type text/plain;
    }
}
NGINXEOF

              # Start a temporary HTTP-only nginx
              docker run -d --name nginx-tmp \
                -p 80:80 \
                -v $(pwd)/nginx-tmp/default.conf:/etc/nginx/conf.d/default.conf:ro \
                -v $(pwd)/certbot/www:/var/www/certbot:ro \
                nginx:alpine

              sleep 3

              # Run certbot to obtain certificate
              docker run --rm \
                -v $(pwd)/certbot/www:/var/www/certbot \
                -v $(pwd)/certbot/conf:/etc/letsencrypt \
                certbot/certbot certonly \
                  --webroot \
                  --webroot-path=/var/www/certbot \
                  --email "$EMAIL" \
                  --agree-tos \
                  --no-eff-email \
                  --non-interactive \
                  -d "$DOMAIN" \
                  -d "www.${DOMAIN}" \
                  -d "api.${DOMAIN}"

              # Cleanup temporary nginx
              docker stop nginx-tmp && docker rm nginx-tmp
              rm -rf nginx-tmp

              echo "==> SSL certificate obtained successfully!"
            else
              echo "==> SSL certs already exist, skipping certbot bootstrap."
            fi

            # -------------------------------------------------------
            # Start backend first, wait for health
            # -------------------------------------------------------
            docker compose up -d backend
            echo "==> Waiting for backend health..."
            attempts=0
            max_attempts=50
            while [ "$attempts" -lt "$max_attempts" ]; do
              status=$(docker inspect --format='{{if .State.Health}}{{.State.Health.Status}}{{else}}no-healthcheck{{end}}' app-backend 2>/dev/null || echo "missing")
              if [ "$status" = "healthy" ]; then
                echo "==> Backend is healthy."
                break
              fi
              if [ "$status" = "unhealthy" ]; then
                echo "==> Backend became unhealthy during startup."
                docker compose logs --no-color --tail=200 backend
                exit 1
              fi
              attempts=$((attempts + 1))
              sleep 3
            done

            if [ "$status" != "healthy" ]; then
              echo "==> Timed out waiting for backend health."
              docker compose logs --no-color --tail=200 backend
              exit 1
            fi

            # -------------------------------------------------------
            # Bring up full stack with SSL
            # -------------------------------------------------------
            docker compose up -d --remove-orphans

            echo "==> Cleaning up old Docker images..."
            docker image prune -f

            echo "==> Checking container status..."
            sleep 10
            docker compose ps

            echo "==> Deployment complete!"
