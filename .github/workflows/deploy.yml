name: Deploy to Hostinger VPS

on:
  push:
    branches: [main]

env:
  DOCKER_BUILDKIT: 1
  COMPOSE_DOCKER_CLI_BUILD: 1

jobs:
  deploy:
    name: Deploy to Production
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Deploy to VPS via SSH
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USERNAME }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT || 22 }}
          script_stop: true
          script: |
            set -e

            APP_DIR="/opt/app"
            REPO_URL="https://github.com/${{ github.repository }}.git"
            BRANCH="main"

            echo "==> Pulling latest code..."
            cd $APP_DIR

            # If repo doesn't exist, clone it
            if [ ! -d ".git" ]; then
              cd /opt
              git clone $REPO_URL app
              cd $APP_DIR
            fi

            git fetch origin $BRANCH
            git reset --hard origin/$BRANCH
            git clean -fd

            echo "==> Creating .env files if they don't exist..."
            # Backend .env (created from GitHub secrets)
            cat > backend/.env << 'ENVEOF'
            PORT=3000
            NODE_ENV=production
            DATABASE_URL=${{ secrets.DATABASE_URL }}
            JWT_SECRET=${{ secrets.JWT_SECRET }}
            JWT_EXPIRES_IN=7d
            TWILIO_ACCOUNT_SID=${{ secrets.TWILIO_ACCOUNT_SID }}
            TWILIO_AUTH_TOKEN=${{ secrets.TWILIO_AUTH_TOKEN }}
            TWILIO_PHONE_NUMBER=${{ secrets.TWILIO_PHONE_NUMBER }}
            CASHFREE_CLIENT_ID=${{ secrets.CASHFREE_CLIENT_ID }}
            CASHFREE_CLIENT_SECRET=${{ secrets.CASHFREE_CLIENT_SECRET }}
            CASHFREE_ENV=${{ secrets.CASHFREE_ENV }}
            DIGIO_CLIENT_ID=${{ secrets.DIGIO_CLIENT_ID }}
            DIGIO_CLIENT_SECRET=${{ secrets.DIGIO_CLIENT_SECRET }}
            DIGIO_ENV=${{ secrets.DIGIO_ENV }}
            ENVEOF
            # Remove leading whitespace from heredoc
            sed -i 's/^[[:space:]]*//' backend/.env

            echo "==> Building and deploying containers..."
            export NEXT_PUBLIC_API_URL=${{ secrets.NEXT_PUBLIC_API_URL }}

            docker compose down --remove-orphans
            docker compose build --no-cache
            docker compose up -d --remove-orphans

            echo "==> Cleaning up old Docker images..."
            docker image prune -f

            echo "==> Checking container health..."
            sleep 10
            docker compose ps

            echo "==> Deployment complete!"
