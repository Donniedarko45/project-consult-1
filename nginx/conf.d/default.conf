# ===================================================
# nginx config for ashwinisdresearch.com
# Handles both HTTP (ACME challenge) and HTTPS (after cert issuance)
# ===================================================

# Redirect HTTP → HTTPS (or serve ACME challenge)
server {
    listen 80;
    server_name ashwinisdresearch.com www.ashwinisdresearch.com api.ashwinisdresearch.com;

    # Let's Encrypt ACME challenge — MUST be before redirect
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# Frontend — ashwinisdresearch.com
server {
    listen 443 ssl;
    http2 on;
    server_name ashwinisdresearch.com;

    ssl_certificate     /etc/letsencrypt/live/ashwinisdresearch.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/ashwinisdresearch.com/privkey.pem;

    # SSL settings
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 10m;

    # Security headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    location / {
        proxy_pass http://app-frontend:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
    }
}

# Redirect www → non-www
server {
    listen 443 ssl;
    http2 on;
    server_name www.ashwinisdresearch.com;

    ssl_certificate     /etc/letsencrypt/live/ashwinisdresearch.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/ashwinisdresearch.com/privkey.pem;

    return 301 https://ashwinisdresearch.com$request_uri;
}

# Backend API — api.ashwinisdresearch.com
server {
    listen 443 ssl;
    http2 on;
    server_name api.ashwinisdresearch.com;

    ssl_certificate     /etc/letsencrypt/live/ashwinisdresearch.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/ashwinisdresearch.com/privkey.pem;

    # SSL settings
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 10m;

    # Security headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    location / {
        limit_req zone=api burst=50 nodelay;

        proxy_pass http://app-backend:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
    }
}
